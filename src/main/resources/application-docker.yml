spring:
  profiles:
    active: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/inventory_db}
    username: ${DATABASE_USER:inventory_user}
    password: ${DATABASE_PASSWORD:inventory_pass}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000

# Docker-specific external service URLs
services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product-service:8080/api}
    timeout: 10000
  user:
    base-url: ${USER_SERVICE_URL:http://user-service:8080/api}
    timeout: 10000
  time:
    base-url: ${TIME_SERVICE_URL:http://time-service:8080/api}
    timeout: 5000

logging:
  level:
    ai.shreds: INFO
    org.springframework.transaction: INFO

# Docker health check configuration
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true