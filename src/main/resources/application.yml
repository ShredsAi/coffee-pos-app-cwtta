server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: product-catalog-shred
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/product_catalog}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 20
        order_inserts: true
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

storage:
  s3:
    bucket: ${S3_BUCKET_NAME:product-media}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  cdn:
    base-url: ${CDN_BASE_URL:http://localhost:9000/product-media}

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.hibernate.SQL: INFO
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method

# Default media settings
media:
  default-sort-order: 999
  allowed-mime-types:
    image: ["image/jpeg", "image/png", "image/webp", "image/gif"]
    video: ["video/mp4", "video/webm"]
    document: ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
  max-size:
    image: 5MB
    video: 100MB
    document: 10MB