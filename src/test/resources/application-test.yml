server:
  port: 0  # Use random port for tests

spring:
  application:
    name: product-catalog-shred-test
  datasource:
    # These will be overridden by the test @DynamicPropertySource
    url: jdbc:postgresql://localhost:5432/test
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: create-drop  # Allow schema creation in tests
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 20
        order_inserts: true
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    enabled: false  # Disable security for integration tests

# Storage configuration will be overridden by @DynamicPropertySource
storage:
  s3:
    bucket: test-bucket
    region: us-east-1
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
  cdn:
    base-url: http://localhost:9000/test-bucket

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    org.testcontainers: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method

# Default media settings for tests
media:
  default-sort-order: 999
  allowed-mime-types:
    image: ["image/jpeg", "image/png", "image/webp", "image/gif"]
    video: ["video/mp4", "video/webm"]
    document: ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
  max-size:
    image: 5MB
    video: 100MB
    document: 10MB

# Disable security for tests
management:
  security:
    enabled: false